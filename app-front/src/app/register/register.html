<div class="auth-container">
  <h2>Crear Cuenta</h2>
  
  @if (errorMessage()) {
    <p style="color: red;">{{ errorMessage() }}</p>
  }

  <form #regForm="ngForm" (ngSubmit)="onRegister(regForm.value)">
    <input type="text" name="fullname" ngModel placeholder="Nombre" required>
    <input type="email" name="email" ngModel placeholder="Correo" required>
    <input type="password" name="password" ngModel placeholder="Contraseña" required>
    
    <button type="submit" [disabled]="!regForm.valid">Registrarme</button>
  </form>

  <p>¿Ya tienes cuenta? <button (click)="goToLogin()">Volver al Login</button></p>
</div>
