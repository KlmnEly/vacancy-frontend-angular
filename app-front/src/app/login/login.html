<div class="auth-container">
  <h2>Iniciar Sesión</h2>
  <form #loginForm="ngForm" (ngSubmit)="onLogin(loginForm.value)">
    <input type="email" name="email" ngModel placeholder="Correo" required>
    <input type="password" name="password" ngModel placeholder="Contraseña" required>
    <button type="submit">Entrar</button>
  </form>
  <p>¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
</div>
